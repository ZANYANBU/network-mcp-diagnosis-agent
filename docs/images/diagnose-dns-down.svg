<rect width="100%" height="100%" rx="10" fill="#0e1a2b"/>
<circle cx="22" cy="18" r="6" fill="#f87171"/><circle cx="42" cy="18" r="6" fill="#fbbf24"/><circle cx="62" cy="18" r="6" fill="#4ade80"/>
<text x="374" y="23" text-anchor="middle" fill="#9aaab9" font-family="Menlo, Consolas, monospace" font-size="12">netdiag: DNS server down (simulated)</text>
<g fill="#d7f5ee" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12.5">
<text x="24" y="58" xml:space="preserve">$ netdiag diagnose youtube.com</text>
<text x="24" y="77" xml:space="preserve">Diagnosis for youtube.com</text>
<text x="24" y="96" xml:space="preserve"></text>
<text x="24" y="115" xml:space="preserve"> 1. [<tspan fill="#4ade80" font-weight="700">PASS</tspan>] Physical    Network interface up: active interfaces: en0</text>
<text x="24" y="134" xml:space="preserve"> 2. [<tspan fill="#4ade80" font-weight="700">PASS</tspan>] Physical    Wi-Fi signal: -58 dBm (strong)</text>
<text x="24" y="153" xml:space="preserve"> 3. [<tspan fill="#4ade80" font-weight="700">PASS</tspan>] Network     Has an IP address: IPv4: 192.168.1.21</text>
<text x="24" y="172" xml:space="preserve"> 4. [<tspan fill="#4ade80" font-weight="700">PASS</tspan>] Network     Default gateway set: gateway: 192.168.1.1</text>
<text x="24" y="191" xml:space="preserve"> 5. [<tspan fill="#4ade80" font-weight="700">PASS</tspan>] Network     Reach the gateway: 192.168.1.1: 3/3 replies, avg 4.2 ms, loss 0%</text>
<text x="24" y="210" xml:space="preserve"> 6. [<tspan fill="#4ade80" font-weight="700">PASS</tspan>] Network     Reach the Internet by IP: 1.1.1.1: 3/3 replies, avg 4.2 ms, loss 0%</text>
<text x="24" y="229" xml:space="preserve"> 7. [<tspan fill="#f87171" font-weight="700">FAIL</tspan>] Application DNS lookup of youtube.com: Timeout: the DNS operation timed out</text>
<text x="24" y="248" xml:space="preserve"> 8. [<tspan fill="#4ade80" font-weight="700">PASS</tspan>] Application DNS lookup through 1.1.1.1: 142.250.183.14</text>
<text x="24" y="267" xml:space="preserve"></text>
<text x="24" y="286" xml:space="preserve"><tspan fill="#ffffff" font-weight="700">Problem at the Application layer. The Internet works, but this computer&#x27;s DNS server is not</tspan></text>
<text x="24" y="305" xml:space="preserve">    answering, so names cannot be found.</text>
<text x="24" y="324" xml:space="preserve"><tspan fill="#93c5fd" font-weight="700">Fix:</tspan> Change the DNS server to 1.1.1.1 or 8.8.8.8, or restart the router.</text>
</g></svg>