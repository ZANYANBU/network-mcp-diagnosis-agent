<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#44546a"/></marker>
  </defs>
  <rect width="960" height="330" rx="14" fill="#ffffff"/>
  <text x="32" y="40" font-size="20" font-weight="700" fill="#0e1a2b">How it fits together</text>
  <g font-size="14" text-anchor="middle">
    <rect x="32" y="80" width="150" height="86" rx="12" fill="#44546a"/>
    <text x="107" y="118" fill="#fff" font-weight="700">You</text>
    <text x="107" y="140" fill="#dbe4ee" font-size="12.5">"YouTube won't load"</text>

    <rect x="232" y="80" width="190" height="86" rx="12" fill="#0e8c8c"/>
    <text x="327" y="113" fill="#fff" font-weight="700">Diagnosis agent</text>
    <text x="327" y="134" fill="#d7f5ee" font-size="12.5">Claude, or the built-in</text>
    <text x="327" y="151" fill="#d7f5ee" font-size="12.5">bottom-up diagnosis</text>

    <rect x="482" y="80" width="190" height="86" rx="12" fill="#e8772e"/>
    <text x="577" y="113" fill="#fff" font-weight="700">Network MCP server</text>
    <text x="577" y="134" fill="#fff3e8" font-size="12.5">netdiag-server</text>
    <text x="577" y="151" fill="#fff3e8" font-size="12.5">11 read-only tools</text>

    <rect x="732" y="80" width="196" height="86" rx="12" fill="#2e5aac"/>
    <text x="830" y="118" fill="#fff" font-weight="700">Your network</text>
    <text x="830" y="140" fill="#dde6f7" font-size="12.5">Wi-Fi, router, ISP, DNS, sites</text>
  </g>
  <g stroke="#44546a" stroke-width="2" fill="none">
    <line x1="184" y1="123" x2="228" y2="123" marker-end="url(#a)"/>
    <line x1="426" y1="123" x2="478" y2="123" marker-end="url(#a)" marker-start="url(#a)"/>
    <line x1="676" y1="123" x2="728" y2="123" marker-end="url(#a)" marker-start="url(#a)"/>
  </g>
  <text x="452" y="112" font-size="11.5" fill="#44546a" text-anchor="middle">MCP</text>
  <text x="702" y="112" font-size="11.5" fill="#44546a" text-anchor="middle">runs</text>
  <g font-size="12.5" font-family="Menlo, Consolas, monospace">
    <g fill="#eef4f6">
      <rect x="482" y="196" width="140" height="30" rx="8"/><rect x="632" y="196" width="140" height="30" rx="8"/><rect x="782" y="196" width="146" height="30" rx="8"/>
      <rect x="482" y="234" width="140" height="30" rx="8"/><rect x="632" y="234" width="140" height="30" rx="8"/><rect x="782" y="234" width="146" height="30" rx="8"/>
      <rect x="482" y="272" width="140" height="30" rx="8"/><rect x="632" y="272" width="140" height="30" rx="8"/><rect x="782" y="272" width="146" height="30" rx="8"/>
    </g>
    <g fill="#b85a1c" text-anchor="middle">
      <text x="552" y="216">ping</text><text x="702" y="216">traceroute</text><text x="855" y="216">dns_lookup</text>
      <text x="552" y="254">port_check</text><text x="702" y="254">http_check</text><text x="855" y="254">ip_config</text>
      <text x="552" y="292">interfaces</text><text x="702" y="292">wifi_signal</text><text x="855" y="292">route · arp</text>
    </g>
  </g>
  <g font-size="13" fill="#44546a">
    <text x="32" y="214">The agent never touches the network directly.</text>
    <text x="32" y="236">It asks the MCP server, which runs standard</text>
    <text x="32" y="258">commands and returns plain data. Nothing is</text>
    <text x="32" y="280">changed: every tool only reads.</text>
  </g>
</svg>
